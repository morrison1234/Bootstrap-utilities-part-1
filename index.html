<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My study progress dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { background-color: #f4fff4; font-family: Arial, sans-serif; }
    .lab-hero { background-color: #e6f9ec; border-left: 6px solid #FF5A43; }
    .lab-hero h1 { color: #FF5A43; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
    <div class="lab-hero p-5 mb-4 rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-4">My study progress darshboard</h1>
            <p class="lead">welcome to the progress darshboard for my studies hope you like it. </p>
            <button class="btn btn-primary">math</button>
            <button class="btn btn-sucess">science</button>
            <button class="btn btn-warning">english</button>
            <button class="btn btn-danger">coding</button>
        </div>
        <div class="container">
            <h2 class="selection-title">lessons completed <span class="badge dg-danger">4</span></h2>
            <p>math<span class="badge bg-primary">8 lessons</span></p>
            <p>science<span class="badge bg-sucess">6 lessons</span></p>
            <p>english <span class="badge bg-warning">5 lessons</span></p>
            <p>coding<span class="badge bg-danger">5 lessons</span></p>
        </div>
    </div>
</body>
</html>
