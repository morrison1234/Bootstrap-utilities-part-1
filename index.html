<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My science lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { background-color: #f4fff4; font-family: Arial, sans-serif; }
    .lab-hero { background-color: #e6f9ec; border-left: 6px solid #FF5A43; }
    .lab-hero h1 { color: #FF5A43; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
    <div class="lab-hero p-5 mb-4 rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-4">My science lab</h1>
            <p class="lead">welcome to the lab! here are the expirements running, the discoveries made,how far each research project has come. </p>
            <button class="btn btn-primary">chemistry</button>
            <button class="btn btn-sucess">biology</button>
            <button class="btn btn-warning">physics</button>
            <button class="btn btn-danger">astronomy</button>
        </div>
        <div class="container">
            <h2 class="selection-title">experiments completed <span class="badge dg-danger">4</span></h2>
            <p>chemistry <span class="badge bg-primary"></span></p>
            <p>biology <span class="badge bg-sucess">expirements</span></p>
            <p>physics <span class="badge bg-warning">expirements</span></p>
            <p>astronomy <span class="badge bg-danger">expirements</span></p>
        </div>
    </div>
</body>
</html>
